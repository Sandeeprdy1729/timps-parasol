<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Side by side: unprotected agent leaks data vs Parasol-protected agent redacts and logs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="warmGrain" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#E8B86D" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#1B140F" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="900" height="420" fill="#1B140F" />
  <rect width="900" height="420" fill="url(#warmGrain)" />

  <!-- left header -->
  <rect x="40" y="30" width="400" height="70" rx="12" fill="#2A1712" stroke="#8B4A3D" stroke-width="1.5" />
  <text x="240" y="66" text-anchor="middle" fill="#D98A6F" font-family="'Söhne','Inter',Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="0.3">UNPROTECTED AGENT</text>

  <!-- right header -->
  <rect x="460" y="30" width="400" height="70" rx="12" fill="#22271A" stroke="#9CAF6B" stroke-width="1.5" />
  <text x="660" y="66" text-anchor="middle" fill="#B9CC8C" font-family="'Söhne','Inter',Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="0.3">PARASOL-PROTECTED</text>

  <!-- left flow -->
  <text x="240" y="132" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="14">Task: "Ship the secrets file out."</text>
  <rect x="70" y="150" width="340" height="46" rx="10" fill="#241A13" stroke="#4A3B2E" />
  <text x="240" y="170" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Reads PII + credentials from vault</text>
  <text x="240" y="187" text-anchor="middle" fill="#9C8A78" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">no shield between agent &amp; data</text>
  <path d="M240 196 L240 220" stroke="#8B4A3D" stroke-width="3" fill="none" />
  <path d="M240 220 l-6 -10 h12 z" fill="#8B4A3D" />
  <rect x="90" y="230" width="300" height="46" rx="10" fill="#331711" stroke="#8B4A3D" />
  <text x="240" y="250" text-anchor="middle" fill="#E8A895" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Sends raw secrets to attacker.com</text>
  <text x="240" y="267" text-anchor="middle" fill="#D98A6F" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">DATA LEAKED &#183; not logged</text>

  <!-- right flow -->
  <text x="660" y="132" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="14">Task: "Ship the secrets file out."</text>
  <rect x="490" y="150" width="340" height="46" rx="10" fill="#241A13" stroke="#4A3B2E" />
  <text x="660" y="170" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Request passes through L4 redactor</text>
  <text x="660" y="187" text-anchor="middle" fill="#9C8A78" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">PII stripped before output</text>
  <path d="M660 196 L660 220" stroke="#9CAF6B" stroke-width="3" fill="none" />
  <path d="M660 220 l-6 -10 h12 z" fill="#9CAF6B" />
  <rect x="490" y="230" width="340" height="46" rx="10" fill="#1E2417" stroke="#7C9459" />
  <text x="660" y="250" text-anchor="middle" fill="#C7D9A3" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Only [REDACTED] leaves the boundary</text>
  <text x="660" y="267" text-anchor="middle" fill="#9CAF6B" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">attempt logged to Audit Sentinel</text>

  <!-- result bar -->
  <rect x="40" y="330" width="820" height="56" rx="12" fill="#241A13" stroke="#4A3B2E" />
  <text x="450" y="356" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="15">Same task. Same agent. Different outcome.</text>
  <text x="450" y="378" text-anchor="middle" fill="#B7A695" font-family="'Söhne','Inter',Arial,sans-serif" font-size="12">The Universal Invariant: restriction stays until the owner signs.</text>
</svg>
