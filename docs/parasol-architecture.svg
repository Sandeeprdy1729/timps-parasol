<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" aria-label="TIMPS-Parasol layered architecture: agent fleet through the 5-layer shield to protected resources" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#E8B86D" />
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241A13" />
      <stop offset="100%" stop-color="#1B140F" />
    </linearGradient>
  </defs>
  <rect width="900" height="780" fill="#1B140F" />

  <!-- Title -->
  <text x="450" y="46" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="24" font-weight="700">TIMPS-Parasol · Unified Agentic Security Shield</text>

  <!-- AGENT / FLEET layer -->
  <rect x="200" y="70" width="500" height="70" rx="14" fill="url(#g)" />
  <text x="450" y="103" text-anchor="middle" fill="#ffffff" font-family="'Söhne','Inter',Arial,sans-serif" font-size="18" font-weight="700">AGENT / FLEET</text>
  <text x="450" y="124" text-anchor="middle" fill="#F8E9D8" font-family="'Söhne','Inter',Arial,sans-serif" font-size="12">one agent · or a coordinating swarm</text>

  <!-- down arrow -->
  <path d="M450 140 L450 172" stroke="#D97757" stroke-width="3" fill="none" />
  <path d="M450 172 l-6 -10 h12 z" fill="#D97757" />

  <!-- Layers L1-L5 -->
  <!-- L4 -->
  <rect x="120" y="182" width="660" height="72" rx="10" fill="url(#shield)" stroke="#D97757" stroke-width="1.5" />
  <rect x="120" y="182" width="160" height="72" rx="10" fill="#3A2517" />
  <text x="200" y="210" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">L4 · AI SAFETY</text>
  <text x="200" y="229" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">SHIELD</text>
  <text x="460" y="207" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Prompt injection detection · social-engineering freeze</text>
  <text x="460" y="227" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">PII redaction · output scan · OWASP LLM / Agentic mapping</text>
  <text x="460" y="247" text-anchor="middle" fill="#B7A695" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">Defends against: what an agent is told</text>

  <!-- L2 -->
  <rect x="120" y="266" width="660" height="72" rx="10" fill="url(#shield)" stroke="#D97757" stroke-width="1.5" />
  <rect x="120" y="266" width="160" height="72" rx="10" fill="#3A2517" />
  <text x="200" y="294" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">L2 · IDENTITY</text>
  <text x="200" y="313" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">&amp; TRUST</text>
  <text x="460" y="291" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Ed25519 owner anchor · a display name is never enough</text>
  <text x="460" y="311" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">RBAC · JWT · zero-trust claims · cross-channel suspicion flags</text>
  <text x="460" y="331" text-anchor="middle" fill="#B7A695" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">Defends against: who an agent claims to be</text>

  <!-- L3 -->
  <rect x="120" y="350" width="660" height="72" rx="10" fill="url(#shield)" stroke="#D97757" stroke-width="1.5" />
  <rect x="120" y="350" width="160" height="72" rx="10" fill="#3A2517" />
  <text x="200" y="378" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">L3 · DATA</text>
  <text x="200" y="397" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">VAULT</text>
  <text x="460" y="375" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">AES-256-GCM · per-user key isolation</text>
  <text x="460" y="395" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">key rotation · granular access control</text>
  <text x="460" y="415" text-anchor="middle" fill="#B7A695" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">Defends against: what an agent knows</text>

  <!-- L1 -->
  <rect x="120" y="434" width="660" height="72" rx="10" fill="url(#shield)" stroke="#D97757" stroke-width="1.5" />
  <rect x="120" y="434" width="160" height="72" rx="10" fill="#3A2517" />
  <text x="200" y="462" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">L1 · PERIMETER</text>
  <text x="200" y="481" text-anchor="middle" fill="#E8B86D" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">GATE</text>
  <text x="460" y="459" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Rate limiting · request sanitization</text>
  <text x="460" y="479" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">request signing · DDoS / abuse protection</text>
  <text x="460" y="499" text-anchor="middle" fill="#B7A695" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">Defends against: what an agent does (entry)</text>

  <!-- down arrow -->
  <path d="M450 506 L450 538" stroke="#D97757" stroke-width="3" fill="none" />
  <path d="M450 538 l-6 -10 h12 z" fill="#D97757" />

  <!-- L5 audit -->
  <rect x="120" y="548" width="660" height="72" rx="10" fill="url(#shield)" stroke="#E8B86D" stroke-width="1.5" />
  <rect x="120" y="548" width="160" height="72" rx="10" fill="#3A2517" />
  <text x="200" y="576" text-anchor="middle" fill="#F0C987" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">L5 · AUDIT</text>
  <text x="200" y="595" text-anchor="middle" fill="#F0C987" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13" font-weight="700">SENTINEL</text>
  <text x="460" y="573" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">Append-only logs · breach alerts · webhooks</text>
  <text x="460" y="593" text-anchor="middle" fill="#F4EBDD" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">full-revocation kill switch (roadmap)</text>
  <text x="460" y="613" text-anchor="middle" fill="#B7906A" font-family="'Söhne','Inter',Arial,sans-serif" font-size="11">Defends against: what happened, unbreakably</text>

  <!-- down arrow -->
  <path d="M450 620 L450 652" stroke="#D97757" stroke-width="3" fill="none" />
  <path d="M450 652 l-6 -10 h12 z" fill="#D97757" />

  <!-- resources row -->
  <text x="450" y="676" text-anchor="middle" fill="#B7A695" font-family="'Söhne','Inter',Arial,sans-serif" font-size="12">every interaction is audited · no action bypasses the shield</text>

  <rect x="60" y="700" width="150" height="56" rx="10" fill="#1B140F" stroke="#4A3B2E" stroke-width="1.5" />
  <text x="135" y="726" text-anchor="middle" fill="#DCCBB8" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">private data</text>
  <text x="135" y="744" text-anchor="middle" fill="#9C8A78" font-family="'Söhne','Inter',Arial,sans-serif" font-size="10">databases</text>

  <rect x="255" y="700" width="150" height="56" rx="10" fill="#1B140F" stroke="#4A3B2E" stroke-width="1.5" />
  <text x="330" y="726" text-anchor="middle" fill="#DCCBB8" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">tools &amp; shell</text>
  <text x="330" y="744" text-anchor="middle" fill="#9C8A78" font-family="'Söhne','Inter',Arial,sans-serif" font-size="10">exec · APIs</text>

  <rect x="450" y="700" width="150" height="56" rx="10" fill="#1B140F" stroke="#4A3B2E" stroke-width="1.5" />
  <text x="525" y="726" text-anchor="middle" fill="#DCCBB8" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">credentials</text>
  <text x="525" y="744" text-anchor="middle" fill="#9C8A78" font-family="'Söhne','Inter',Arial,sans-serif" font-size="10">secrets · keys</text>

  <rect x="645" y="700" width="190" height="56" rx="10" fill="#1B140F" stroke="#8B4A3D" stroke-width="1.5" />
  <text x="740" y="726" text-anchor="middle" fill="#D98A6F" font-family="'Söhne','Inter',Arial,sans-serif" font-size="13">OTHER AGENTS</text>
  <text x="740" y="744" text-anchor="middle" fill="#5C2E22" font-family="'Söhne','Inter',Arial,sans-serif" font-size="10">coordination shield (roadmap)</text>
</svg>
